name: Check Supabase access

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/supabase-access.yml
      - .github/scripts/check_supabase_access.py
      - .github/supabase-check-trigger.txt

permissions:
  contents: read

jobs:
  check-access:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read repository files
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check Supabase management access (read only)
        id: supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 .github/scripts/check_supabase_access.py
      - name: Authorization verified
        if: steps.supabase.outputs.authorized == 'true'
        run: echo 'Supabase management authorization is available for the next setup step.'
